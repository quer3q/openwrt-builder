name: NanoPI R3S

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "01 15 */20 * *"

permissions:
  contents: write

concurrency:
  group: nanopi-r3s-openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "25.12.6"
  PROFILE: "friendlyarm_nanopi-r3s"
  PASSWALL_ARCH: "aarch64_generic"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libncurses-dev zlib1g-dev gawk git \
            gettext libssl-dev xsltproc rsync wget unzip python3 zstd
          sudo apt-get clean

      - name: Download Image Builder
        run: |
          wget -q "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/rockchip/armv8/openwrt-imagebuilder-${OPENWRT_VERSION}-rockchip-armv8.Linux-x86_64.tar.zst"
          tar --zstd -xf openwrt-imagebuilder-*.tar.zst
          mv openwrt-imagebuilder-*/ imagebuilder/

      - name: Add Passwall2 apk feed
        run: |
          RELEASE="${OPENWRT_VERSION%.*}"
          BASE="https://sourceforge.net/projects/openwrt-passwall-build/files"

          # Signing key: for the Image Builder, and for the router itself
          wget -q -O imagebuilder/keys/passwall.pem "${BASE}/apk.pub/download"
          mkdir -p imagebuilder/files/etc/apk/keys imagebuilder/files/etc/apk/repositories.d
          cp imagebuilder/keys/passwall.pem imagebuilder/files/etc/apk/keys/passwall.pem

          # Feeds: resolve Passwall2 + deps at build time, and allow `apk` updates on the router
          for repo in passwall_packages passwall_luci passwall2; do
            echo "${BASE}/releases/packages-${RELEASE}/${PASSWALL_ARCH}/${repo}/packages.adb" \
              | tee -a imagebuilder/repositories \
                       imagebuilder/files/etc/apk/repositories.d/customfeeds.list > /dev/null
          done

      - name: Add zapret2 + marksocks apk feeds
        run: |
          Z="https://github.com/quer3q/zapret2-openwrt/releases/latest/download"
          M="https://github.com/quer3q/marksocks/releases/latest/download"
          wget -q -O imagebuilder/keys/zapret2.pem "${Z}/zapret2.pem"
          wget -q -O imagebuilder/keys/marksocks.pem "${M}/marksocks.pem"
          cp imagebuilder/keys/zapret2.pem imagebuilder/keys/marksocks.pem imagebuilder/files/etc/apk/keys/
          printf '%s\n' "${Z}/packages-${PASSWALL_ARCH}.adb" "${M}/packages.adb" \
            | tee -a imagebuilder/repositories \
                     imagebuilder/files/etc/apk/repositories.d/customfeeds.list > /dev/null

      - name: Add ROM overlay files
        run: cp -r files/nanopi-r3s/. imagebuilder/files/

      - name: Configure partition sizes
        run: |
          cd imagebuilder
          sed -i 's/CONFIG_TARGET_KERNEL_PARTSIZE=.*/CONFIG_TARGET_KERNEL_PARTSIZE=32/' .config
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' .config

      - name: Build image
        run: |
          cd imagebuilder
          make image \
            PROFILE="${PROFILE}" \
            FILES="files" \
            PACKAGES=" \
              -dnsmasq dnsmasq-full \
              luci \
              luci-app-passwall2 xray-core \
              kmod-nft-socket kmod-nft-tproxy \
              adguardhome \
              parted losetup resize2fs \
              ethtool kmod-tcp-bbr \
              zapret2 marksocks \
            "

      - name: TAR output
        run: tar -cvf nanopi-r3s-images.tar imagebuilder/bin/targets/rockchip/armv8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r3s-images
          path: nanopi-r3s-images.tar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Make a release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nanopi-r3s-images

      - name: Extract artifacts
        run: tar xf nanopi-r3s-images.tar

      - name: Get the current date
        run: echo "NOW=$(date +%F)" >> "$GITHUB_ENV"

      - name: Create a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "r3s-${{ env.NOW }}"
          name: "NanoPI R3S v${{ env.OPENWRT_VERSION }}"
          prerelease: false
          files: imagebuilder/bin/targets/rockchip/armv8/*
          generate_release_notes: false
